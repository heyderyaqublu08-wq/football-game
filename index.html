<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Penalty & Free Kick Master</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            user-select: none;
            overflow: hidden;
        }
        header {
            background: #1e293b;
            padding: 12px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px solid #334155;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 500px;
            margin: 15px auto;
        }
        canvas {
            background: #15803d;
            border: 4px solid #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            cursor: crosshair;
        }
        .power-bar-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 20px;
            background: #334155;
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }
        .power-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
        }
        .instruction {
            margin-top: 5px;
            color: #94a3b8;
            font-size: 15px;
        }
        .btn-reset {
            background: #22c55e;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-reset:hover { background: #16a34a; }
    </style>
</head>
<body>

    <header>
        <div>⚽ HESAB: <span id="scoreText" style="color: #4ade80;">0</span></div>
        <div>🏆 PRO PENALTY 3D-STYLE</div>
        <div>🧤 SEYV: <span id="savedText" style="color: #f87171;">0</span></div>
        <button class="btn-reset" onclick="resetGame()">Yenidən Başla 🔄</button>
    </header>

    <div id="gameContainer">
        <canvas id="pitch" width="800" height="500"></canvas>
        <div class="power-bar-container" id="powerContainer">
            <div class="power-bar" id="powerBar"></div>
        </div>
    </div>

    <p class="instruction">💡 **Oynamaq qaydası:** Qapıda vurmaq istədiyin yeri **KILIKLƏ** (və ya ekrana toxun), sonra **SPACE (Probel)** basıb saxlayaraq gücü seç və burax!</p>

    <script>
        const canvas = document.getElementById("pitch");
        const ctx = canvas.getContext("2d");

        let score = 0, saved = 0;
        let targetX = 400, targetY = 150;
        let isAiming = false;
        let isPowering = false;
        let power = 0;
        let powerInterval;

        // Top Obyekti (Böyük və aydın)
        let ball = {
            x: 400, y: 400,
            targetX: 400, targetY: 150,
            radius: 18,
            isMoving: false,
            scale: 1,
            speed: 0
        };

        // Qapıçı
        let keeper = {
            x: 360, y: 130,
            w: 80, h: 25,
            vx: 3,
            targetX: 360
        };

        // Qapı Ölçüləri
        const goal = { x: 200, y: 60, w: 400, h: 140 };

        canvas.addEventListener("click", (e) => {
            if (ball.isMoving) return;
            const rect = canvas.getBoundingClientRect();
            targetX = e.clientX - rect.left;
            targetY = e.clientY - rect.top;
            
            // Yalnız qapı ərazisinə nişan almağa icazə ver
            if (targetY < 250) {
                isAiming = true;
                document.getElementById("powerContainer").style.display = "block";
            }
        });

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" && isAiming && !isPowering && !ball.isMoving) {
                isPowering = true;
                power = 0;
                powerInterval = setInterval(() => {
                    power += 4;
                    if (power > 100) power = 100;
                    document.getElementById("powerBar").style.width = power + "%";
                }, 20);
            }
        });

        window.addEventListener("keyup", (e) => {
            if (e.code === "Space" && isPowering) {
                clearInterval(powerInterval);
                isPowering = false;
                shootBall();
            }
        });

        function shootBall() {
            ball.isMoving = true;
            ball.targetX = targetX;
            ball.targetY = targetY;
            ball.speed = 0.05 + (power / 2000);

            // Qapıçının tullanacağı tərəf (Süni İntellekt)
            let jumpDirections = [targetX, targetX + (Math.random() * 100 - 50), 400];
            keeper.targetX = jumpDirections[Math.floor(Math.random() * jumpDirections.length)] - keeper.w / 2;
        }

        function update() {
            // Qapıçı Hərəkəti
            if (!ball.isMoving) {
                keeper.x += keeper.vx;
                if (keeper.x < 220 || keeper.x + keeper.w > 580) keeper.vx *= -1;
            } else {
                // Qapıçının şuta reaksiyası
                keeper.x += (keeper.targetX - keeper.x) * 0.1;

                // Topun Uçuşu (Perspective 3D Effect)
                ball.x += (ball.targetX - ball.x) * 0.08;
                ball.y += (ball.targetY - ball.y) * 0.08;
                ball.scale -= 0.012; // Uzaqlaşdıqca kiçilmə effekti
                if (ball.scale < 0.5) ball.scale = 0.5;

                // Zərbənin Sonu və Nəticə Yoxlanışı
                if (Math.abs(ball.y - ball.targetY) < 5) {
                    checkGoal();
                }
            }
        }

        function checkGoal() {
            ball.isMoving = false;
            
            // Qapıçı tutdumu?
            let savedByGK = (ball.x >= keeper.x && ball.x <= keeper.x + keeper.w && ball.y >= keeper.y && ball.y <= keeper.y + keeper.h);

            // Qapıya daxil oldumu?
            let inGoal = (ball.x >= goal.x && ball.x <= goal.x + goal.w && ball.y >= goal.y && ball.y <= goal.y + goal.h);

            if (savedByGK) {
                saved++;
                document.getElementById("savedText").innerText = saved;
                alert("🧤 QAPICI SEYV ETDİ!");
            } else if (inGoal) {
                score++;
                document.getElementById("scoreText").innerText = score;
                alert("⚽ QOOOOOLLLL!");
            } else {
                alert("❌ AUT! Zərbə dəqiq olmadı.");
            }

            resetBall();
        }

        function resetBall() {
            ball.x = 400;
            ball.y = 400;
            ball.scale = 1;
            isAiming = false;
            document.getElementById("powerContainer").style.display = "none";
            document.getElementById("powerBar").style.width = "0%";
            keeper.x = 360;
        }

        function resetGame() {
            score = 0;
            saved = 0;
            document.getElementById("scoreText").innerText = 0;
            document.getElementById("savedText").innerText = 0;
            resetBall();
        }

        function drawPitch() {
            // Ot Örtüyü (3D Hissiyyatlı Zolaqlar)
            ctx.fillStyle = "#15803d";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < 5; i++) {
                ctx.fillStyle = (i % 2 === 0) ? "#166534" : "#15803d";
                ctx.fillRect(0, 200 + (i * 60), canvas.width, 60);
            }

            // Tribuna Bələdçisi (Arxa Fon)
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 0, canvas.width, goal.y);

            // Qapı Toru və Direklər
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 6;
            ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);

            // Tor Naxışları
            ctx.strokeStyle = "rgba(255,255,255,0.15)";
            ctx.lineWidth = 1;
            for (let x = goal.x; x <= goal.x + goal.w; x += 20) {
                ctx.beginPath(); ctx.moveTo(x, goal.y); ctx.lineTo(x, goal.y + goal.h); ctx.stroke();
            }
            for (let y = goal.y; y <= goal.y + goal.h; y += 20) {
                ctx.beginPath(); ctx.moveTo(goal.x, y); ctx.lineTo(goal.x + goal.w, y); ctx.stroke();
            }

            // Penalti Nöqtəsi
            ctx.beginPath();
            ctx.arc(400, 400, 5, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();

            // Nişan Alınan Yer (Hədəf Xaçı)
            if (isAiming && !ball.isMoving) {
                ctx.strokeStyle = "#ef4444";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(targetX, targetY, 12, 0, Math.PI * 2);
                ctx.moveTo(targetX - 18, targetY); ctx.lineTo(targetX + 18, targetY);
                ctx.moveTo(targetX, targetY - 18); ctx.lineTo(targetX, targetY + 18);
                ctx.stroke();
            }
        }

        function drawKeeper() {
            // Qapıçı (Formalı)
            ctx.fillStyle = "#f97316";
            ctx.fillRect(keeper.x, keeper.y, keeper.w, keeper.h);
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.strokeRect(keeper.x, keeper.y, keeper.w, keeper.h);

            // Əlcəklər
            ctx.fillStyle = "#fff";
            ctx.fillRect(keeper.x - 8, keeper.y, 8, 15);
            ctx.fillRect(keeper.x + keeper.w, keeper.y, 8, 15);
        }

        function drawBall() {
            ctx.save();
            ctx.translate(ball.x, ball.y);
            let currentRadius = ball.radius * ball.scale;

            // Topun Kölgəsi
            ctx.beginPath();
            ctx.ellipse(0, currentRadius * 0.8, currentRadius, currentRadius * 0.3, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.fill();

            // Ağ Top Gövdəsi
            ctx.beginPath();
            ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Topun Üzərindəki Klassik Xanalar
            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.arc(0, 0, currentRadius * 0.35, 0, Math.PI * 2);
            ctx.fill();

            for (let i = 0; i < 5; i++) {
                let ang = (i * Math.PI * 2) / 5;
                ctx.beginPath();
                ctx.arc(Math.cos(ang) * (currentRadius * 0.65), Math.sin(ang) * (currentRadius * 0.65), currentRadius * 0.2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function loop() {
            update();
            drawPitch();
            drawKeeper();
            drawBall();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
