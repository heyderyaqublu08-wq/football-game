<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFootball Mini</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            text-align: center;
            font-family: sans-serif;
        }
        #gameCanvas {
            background: #2e7d32;
            border: 3px solid #fff;
            display: block;
            margin: 10px auto;
        }
        .info {
            font-size: 18px;
            font-weight: bold;
            margin: 10px;
        }
    </style>
</head>
<body>

    <h2>⚽ eFootball Penalti ⚽</h2>
    <div class="info">Qol: <span id="score" style="color:#00ff00;">0</span> | Seyv: <span id="saved" style="color:#ff3333;">0</span></div>

    <canvas id="gameCanvas" width="360" height="460"></canvas>
    <p>Zərbə vurmaq üçün qapıya tərəf kliklə və ya ekrana toxun!</p>

    <script>
        var canvas = document.getElementById("gameCanvas");
        var ctx = canvas.getContext("2d");

        var ball = { x: 180, y: 390, r: 10, vx: 0, vy: 0 };
        var keeper = { x: 150, y: 90, w: 60, h: 18, vx: 2 };
        var score = 0;
        var saved = 0;
        var isMoving = false;
        var msg = "Zərbə vur!";

        canvas.addEventListener("click", function(e) {
            if (isMoving) return;
            var rect = canvas.getBoundingClientRect();
            var clickX = e.clientX - rect.left;
            var clickY = e.clientY - rect.top;

            if (clickY < ball.y) {
                var dx = clickX - ball.x;
                var dy = clickY - ball.y;
                var angle = Math.atan2(dy, dx);
                ball.vx = Math.cos(angle) * 9;
                ball.vy = Math.sin(angle) * 9;
                isMoving = true;
                msg = "";
            }
        });

        function update() {
            if (!isMoving) {
                keeper.x += keeper.vx;
                if (keeper.x <= 60 || keeper.x + keeper.w >= 300) keeper.vx *= -1;
            } else {
                ball.x += ball.vx;
                ball.y += ball.vy;

                // Qapıçı tutdu
                if (ball.x > keeper.x && ball.x < keeper.x + keeper.w && ball.y - ball.r <= keeper.y + keeper.h && ball.y + ball.r >= keeper.y) {
                    saved++;
                    document.getElementById("saved").innerText = saved;
                    msg = "QAPICI TUTDU!";
                    reset();
                }
                // Qol
                else if (ball.y <= 80 && ball.x >= 60 && ball.x <= 300) {
                    score++;
                    document.getElementById("score").innerText = score;
                    msg = "QOOOL!";
                    reset();
                }
                // Aut
                else if (ball.y < 30 || ball.x < 10 || ball.x > 350) {
                    msg = "AUT!";
                    reset();
                }
            }
        }

        function reset() {
            isMoving = false;
            setTimeout(function() {
                ball.x = 180;
                ball.y = 390;
                ball.vx = 0;
                ball.vy = 0;
                msg = "Zərbə vur!";
            }, 1000);
        }

        function draw() {
            // Meydança
            ctx.fillStyle = "#2e7d32";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Qapı
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.strokeRect(60, 40, 240, 45);

            // Qapıçı
            ctx.fillStyle = "#ff5722";
            ctx.fillRect(keeper.x, keeper.y, keeper.w, keeper.h);

            // Top
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.stroke();

            // Mətn
            if (msg) {
                ctx.fillStyle = "#ffeb3b";
                ctx.font = "bold 20px Arial";
                ctx.fillText(msg, 120, 250);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
